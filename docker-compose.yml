services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dunbar_local
      POSTGRES_USER: dunbar
      POSTGRES_PASSWORD: dunbar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./tmp/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dunbar -d dunbar_local"]
      interval: 2s
      timeout: 5s
      retries: 30
